[package]
name = "analogatique"
version = "0.5.0"
authors = ["Bedir Ekim <root@un1970ix.com>"]
edition = "2024"
rust-version = "1.88"
description = "web gallery for your photos"
categories = ["command-line-utilities"]
keywords = ["cli", "photography", "gallery"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/un1970ix/analogatique"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/analogatique", dest = "/usr/bin/analogatique", mode = "755" },
]

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tera = { version = "2.4.0", default-features = false, features = ["glob_fs"] }
toml = "1.1.8"
