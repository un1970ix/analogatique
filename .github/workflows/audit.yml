name: audit
on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    continue-on-error: true
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-audit@0.22.2
      - id: audit
        continue-on-error: true
        run: cargo audit
      - name: Report Audit Failure
        if: failure() || steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit failed. Review the audit output.'
